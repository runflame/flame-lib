[package]
name = "spacesuit"
version = "0.1.0"
authors = ["Henry de Valence <hdevalence@hdevalence.ca>", "Cathie Yun <cathieyun@gmail.com>", "Oleg Andreev <oleganza@gmail.com>"]
edition = "2018"
license = "Apache-2.0"

[dependencies]
thiserror = "1"
merlin = "3"
rand = "0.8"
subtle = "2"
curve25519-dalek = { version = "4", features = ["serde", "legacy_compatibility", "rand_core"] }
serde = { version = "1.0", features=["derive"] }

[dependencies.bulletproofs]
git = "https://github.com/runflame/bulletproofs"
# The head of `develop` when it was pinned; a branch would let every fresh
# resolve pull whatever lands there next.
rev = "a2f52a0d1a502128f0064b7dace607c83ff7ff73"
features = ["yoloproofs"]

[features]
default = []
nightly = ["curve25519-dalek/alloc", "subtle/nightly", "bulletproofs/nightly"]

[dev-dependencies]
criterion = "0.2"

[[bench]]
name = "spacesuit"
harness = false
