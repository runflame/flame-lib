name: Mint playground image

# Builds demos/mint-playground/Dockerfile, starts it and checks that it
# serves, then, from main only, pushes it to GHCR as
# ghcr.io/runflame/mint-playground:<short commit> and moves `:main` to it.
# A pull request into main runs the same build and check and pushes nothing:
# the dry run before merging. The job holds no keys to any server: the dev
# host runs `:main` with podman auto-update and pulls a new image on its own
# within a minute or two (infrastructure repo, dev README → mint-playground).
#
# Only the demo's own changes build it; flamekd, the payout wallet and the
# other crates it is built with are picked up by the next such change, or by
# running the workflow by hand.

on:
  push:
    branches: [ main ]
    paths:
      - 'demos/mint-playground/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'demos/mint-playground/**'
  workflow_dispatch:

# A newer push supersedes a build still running; its commit gets no image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/runflame/mint-playground
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Tag
      id: tag
      run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

    # The commit, twice: the label is how the host tells which commit `:main`
    # is, MINT_REVISION is the X-Mint-Revision header the service sends.
    - name: Build
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        REVISION: ${{ github.sha }}
      run: |
        docker build -f demos/mint-playground/Dockerfile \
          --label "org.opencontainers.image.revision=$REVISION" \
          --build-arg "MINT_REVISION=$REVISION" \
          -t "$IMAGE:$TAG" .

    # Starts the image as the host does and checks the pages, a built script
    # and the revision header, then stops it with its STOPSIGNAL and expects a
    # clean exit.
    - name: Smoke test
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        docker run -d --name mint -p 127.0.0.1:3000:3000 "$IMAGE:$TAG"
        trap 'docker logs mint' EXIT
        for _ in $(seq 30); do
          curl -sf -o /dev/null http://127.0.0.1:3000/api/state && break
          sleep 1
        done
        script="$(curl -sf http://127.0.0.1:3000/ | grep -o '/assets/[^"]*\.js' | head -1)"
        [ -n "$script" ] || { echo "the page references no built script"; exit 1; }
        curl -sf -o /dev/null "http://127.0.0.1:3000$script"
        curl -sf -o /dev/null http://127.0.0.1:3000/classic
        served="$(curl -sfI http://127.0.0.1:3000/api/state | tr -d '\r' | sed -n 's/^x-mint-revision: //Ip')"
        [ "$served" = "$REVISION" ] || { echo "X-Mint-Revision is '$served', expected $REVISION"; exit 1; }
        docker stop mint
        [ "$(docker inspect -f '{{ .State.ExitCode }}' mint)" = 0 ] || { echo "did not shut down cleanly"; exit 1; }

    # Only from main: a pull request or a manual run elsewhere deploys nothing.
    - name: Push
      if: github.ref == 'refs/heads/main'
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker push "$IMAGE:$TAG"
        docker tag "$IMAGE:$TAG" "$IMAGE:main"
        docker push "$IMAGE:main"
        docker logout ghcr.io
        {
          echo "Pushed \`$IMAGE:$TAG\` and moved \`:main\` to it: dev picks it up within a minute or two. \`curl -sI https://dev-mint.runflame.org/api/state | grep -i x-mint-revision\` shows this commit once it has."
          echo
          echo "To pin dev to this build instead, in the infrastructure repo: \`image_tag: \"$TAG\"\` in \`dev/playground/mint_playground/vars_service.yml\`, then \`ansible-playbook mint_playground/deploy.yml --ask-vault-pass\`."
        } >> "$GITHUB_STEP_SUMMARY"
