[workspace]
# 3 for its Rust-version-aware resolution: whenever `Cargo.lock` is updated,
# resolver 2 would pick dependencies (uniffi's `cargo-platform`, for one)
# newer than the pinned toolchain builds. Releases build `--locked`.
resolver = "3"

members = [
    "cells",
    "readerwriter",
    "merkle",
    "starsig",
    "flamekd",
    "musig",
    "spacesuit",
    "flamevm",
    "btc-integration",
    "flamechain",
    "flamepayments",
    "flamewallet-ffi",
    "flamewallet-wasm",
    "flamed-rpc",
    "flamed",
]

# Use the runflame fork of merlin to enable its `dynamic-labels`
# feature — lifts the upstream `&'static [u8]` label restriction so
# flamevm's `merlin` / `merlinwrite` / `merlinread` opcodes can pass
# user-supplied `&[u8]` labels through to the transcript directly.
[patch.crates-io]
#
# Pinned to a commit, like the bulletproofs fork: an unpinned git source is
# whatever its default branch holds at resolve time.
merlin = { git = "https://github.com/runflame/merlin", rev = "fcc51efb4fc0b47e1a004cfe3aef65f47c5612f0" }

# What the native bindings ship: `release` plus whole-program LTO and one
# codegen unit, which is where proving time on a phone is won, and symbols
# stripped. A profile of its own, so building `flamed` stays as it was.
[profile.release-ffi]
inherits = "release"
lto = true
codegen-units = 1
strip = true
