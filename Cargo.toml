[workspace]
resolver = "2"

members = [
    "cells",
    "readerwriter",
    "merkle",
    "starsig",
    "flamekd",
    "musig",
    "spacesuit",
    "flamevm",
    "btc-integration",
    "flamechain",
    "flamepayments",
    "flamed-rpc",
    "flamed",
    "flamebench",
]

# Use the runflame fork of merlin to enable its `dynamic-labels`
# feature — lifts the upstream `&'static [u8]` label restriction so
# flamevm's `merlin` / `merlinwrite` / `merlinread` opcodes can pass
# user-supplied `&[u8]` labels through to the transcript directly.
[patch.crates-io]
merlin = { git = "https://github.com/runflame/merlin" }

# Proving and verifying are unbearably slow without optimizations, so the
# crypto dependencies are optimized in dev builds too: every test that
# proves or verifies a transaction runs in seconds, not minutes. Only these
# two dependencies, never a workspace member, so debugging flamevm and the
# rest stays as it was. `cargo bench` builds optimized anyway. The price is
# a longer first dev build of these two crates.
[profile.dev.package.bulletproofs]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
