[package]
name = "demo-consensus-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bitcoind = { version = "0.41", features = ["31_0", "download"] }
btc-integration = { path = "../../btc-integration" }
corepc-client = { version = "0.16.0", features = ["client-sync"] }
ed25519-dalek = "2"
flame-chain-service = { path = "../../flame-chain-service" }
flame-minting = { path = "../../flame-minting" }
flame-storage = { path = "../../flame-storage" }
flamechain = { path = "../../flamechain" }
flamevm = { path = "../../flamevm" }
hex = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
