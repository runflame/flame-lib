[package]
name = "p2p"
version = "0.1.0"
authors = ["Oleg Andreev <oleganza@gmail.com>"]
edition = "2018"

[[example]]
name = "chatter"

[dependencies]
byteorder = "1"
merlin = "3"
rand_core = "0.6"
subtle = "2"
curve25519-dalek = { version = "4", features = ["serde", "legacy_compatibility", "rand_core"] }
hex = "^0.3"
futures = "0.3"
tokio = {version = "0.2", features=["full","sync"]}
tokio-util = {version = "0.3.1", features=["codec"]}
bytes = "0.5.4"
aes-siv = { version = "0.7", features = ["pmac"] }
rand = "0.8"
readerwriter = {path = "../../readerwriter", features=["bytes"]}
