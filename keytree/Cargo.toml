[package]
name = "keytree"
version = "0.2.0"
authors = ["Tess Rinearson <tess.rinearson@gmail.com>", "Oleg Andreev <oleganza@gmail.com>"]
edition = "2018"

[dependencies]
curve25519-dalek = { version = "4", features = ["serde", "legacy_compatibility", "rand_core"] }
serde = { version = "1.0", features=["derive"] }
merlin = "3"
rand = "0.8"

[dependencies.starsig]
path = "../starsig"

[dev-dependencies]
rand_chacha = "0.3"
hex = "^0.3"

[features]
default = []
nightly = ["curve25519-dalek/alloc"]
