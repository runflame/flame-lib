# `cargo deny check`: what the dependency graph may contain. The release
# workflow runs it before anything is built, because these crates ship
# inside binaries that an app's own audit (npm, pnpm) cannot see into.

[graph]
all-features = true
# What ships: benches and tests never reach a package.
exclude-dev = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here, with the
# reason it does not apply and who decided so.
ignore = []

[licenses]
# What may be linked into a shipped binary. A new license in the graph fails
# the check until someone reads it and adds it here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"
# Path dependencies inside the workspace carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The two forks the VM builds on, and only them, each pinned to a `rev`
# in its Cargo.toml.
allow-git = [
    "https://github.com/runflame/bulletproofs",
    "https://github.com/runflame/merlin",
]
