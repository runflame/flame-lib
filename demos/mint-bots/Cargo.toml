[package]
name = "mint-bots"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the demo's dependencies and lockfile separate from the protocol workspace.
[workspace]

[dependencies]
axum = "0.8"
bytes = "1"
flamekd = { path = "../../flamekd" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
zeroize = "1"

[dev-dependencies]
# Only to check that the bots' addresses are the wallet's own.
flamepayments = { path = "../../flamepayments" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
merlin = { git = "https://github.com/runflame/merlin", rev = "fcc51efb4fc0b47e1a004cfe3aef65f47c5612f0" }
