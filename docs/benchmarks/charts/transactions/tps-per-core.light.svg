 0 0 1 380.2,194.0 H84.0 Z" class="bar s1"><title>4 → 4: ~265 transactions per second</title></path><text x="392.2" y="188.0" class="value" text-anchor="start">~265</text><text x="72.0" y="228.0" class="label" text-anchor="end">1 → 13</text><path d="M84.0,214.0 H244.7 A4.0,4.0 0 0 1 248.7,218.0 V230.0 A4.0,4.0 0 0 1 244.7,234.0 H84.0 Z" class="bar s1"><title>1 → 13: ~145 transactions per second</title></path><text x="256.7" y="228.0" class="value" text-anchor="start">~145</text><text x="24.0" y="298.0" class="note" text-anchor="start">One core, verification only: no block building or state updates.</text></svg>
