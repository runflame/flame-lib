227.6 A0.8,0.8 0 0 1 228.4,102.8 V121.2 A0.8,0.8 0 0 1 227.6,122.0 H226.9 Z" class="bar s4"><title>1 → 2: Utreexo, per input 0.01 ms</title></path><text x="235.4" y="116.0" class="value" text-anchor="start">2.11 ms</text><text x="72.0" y="156.0" class="label" text-anchor="end">2 → 2</text><rect x="84.0" y="142.0" width="141.0" height="20" class="bar s1"><title>2 → 2: Proof (estimated) 2.10 ms</title></rect><rect x="227.0" y="142.0" width="1.5" height="20" class="bar s2"><title>2 → 2: VM and other 0.00 ms</title></rect><rect x="227.3" y="142.0" width="1.5" height="20" class="bar s3"><title>2 → 2: Signature 0.04 ms</title></rect><path d="M229.8,142.0 H230.6 A0.8,0.8 0 0 1 231.3,142.8 V161.2 A0.8,0.8 0 0 1 230.6,162.0 H229.8 Z" class="bar s4"><title>2 → 2: Utreexo, per input 0.02 ms</title></path><text x="238.9" y="156.0" class="value" text-anchor="start">2.16 ms</text><text x="72.0" y="196.0" class="label" text-anchor="end">4 → 4</text><rect x="84.0" y="182.0" width="247.7" height="20" class="bar s1"><title>4 → 4: Proof (estimated) 3.67 ms</title></rect><rect x="333.7" y="182.0" width="1.5" height="20" class="bar s2"><title>4 → 4: VM and other 0.02 ms</title></rect><rect x="334.8" y="182.0" width="1.5" height="20" class="bar s3"><title>4 → 4: Signature 0.05 ms</title></rect><path d="M338.4,182.0 H339.4 A1.1,1.1 0 0 1 340.5,183.1 V200.9 A1.1,1.1 0 0 1 339.4,202.0 H338.4 Z" class="bar s4"><title>4 → 4: Utreexo, per input 0.03 ms</title></path><text x="348.5" y="196.0" class="value" text-anchor="start">3.77 ms</text><text x="72.0" y="236.0" class="label" text-anchor="end">1 → 13</text><rect x="84.0" y="222.0" width="462.8" height="20" class="bar s1"><title>1 → 13: Proof (estimated) 6.84 ms</title></rect><rect x="548.8" y="222.0" width="1.5" height="20" class="bar s3"><title>1 → 13: Signature 0.03 ms</title></rect><path d="M550.9,222.0 H551.6 A0.8,0.8 0 0 1 552.4,222.8 V241.2 A0.8,0.8 0 0 1 551.6,242.0 H550.9 Z" class="bar s4"><title>1 → 13: Utreexo, per input 0.01 ms</title></path><text x="559.4" y="236.0" class="value" text-anchor="start">6.88 ms</text><text x="24.0" y="306.0" class="note" text-anchor="start">Proof, VM and other, and signature run inside verify; Utreexo is the chain&#x27;s separate check, once per</text><text x="24.0" y="320.0" class="note" text-anchor="start">input.</text><text x="24.0" y="334.0" class="note" text-anchor="start">Signature (30–52 µs) and Utreexo (8–32 µs) are too small to see at this scale; the table has every</text><text x="24.0" y="348.0" class="note" text-anchor="start">value.</text><text x="24.0" y="362.0" class="note" text-anchor="start">Proof: estimated from a synthetic proof with the same multiplier count.</text><text x="24.0" y="376.0" class="note" text-anchor="start">Utreexo: one membership check per input, in a forest of 65,536 leaves.</text><text x="24.0" y="390.0" class="note" text-anchor="start">Flagged: the estimate exceeds verify minus signature for 1 → 2 and 1 → 13; VM and other is clamped to</text><text x="24.0" y="404.0" class="note" text-anchor="start">zero.</text></svg>
