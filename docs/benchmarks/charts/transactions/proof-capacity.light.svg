<svg xmlns="http://www.w3.org/2000/svg" data-theme="light" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="t d"><title id="t">Proof capacity used, out of 1,024 gates</title><desc id="d">Multiplication gates each shape&#x27;s proof needs. 1 → 2: 137 · 13%. 2 → 2: 141 · 14%. 4 → 4: 281 · 27%. 1 → 13: 885 · 86%. 1 → 14: does not prove.</desc><style>
