<svg xmlns="http://www.w3.org/2000/svg" data-theme="dark" width="720" height="348" viewBox="0 0 720 348" role="img" aria-labelledby="t d"><title id="t">Time to send a payment, one core</title><desc id="d">A send in a warm process, and what a new process adds on its first. 1 → 2: 25.6 ms warm, 11.9 ms of setup; a first send in a new process took 34.9 ms. 2 → 2: 25.6 ms warm, 11.6 ms of setup; a first send in a new process took 36.2 ms. 4 → 4: 46.8 ms warm, 11.9 ms of setup; a first send in a new process took 58.8 ms. 1 → 13: 100 ms warm, 12.9 ms of setup; a first send in a new process took 113 ms.</desc><style>
