x="72.0" y="228.0" class="label" text-anchor="end">1 → 13</text><path d="M84.0,214.0 H524.3 A4.0,4.0 0 0 1 528.3,218.0 V230.0 A4.0,4.0 0 0 1 524.3,234.0 H84.0 Z" class="bar s1"><title>1 → 13: 3.2 MB (3,223,438 bytes)</title></path><text x="536.3" y="228.0" class="value" text-anchor="start">3.2 MB</text><text x="24.0" y="298.0" class="note" text-anchor="start">A counting allocator, from the start of the send to its end. A warm send, with the table already</text><text x="24.0" y="312.0" class="note" text-anchor="start">built, needs less.</text></svg>
