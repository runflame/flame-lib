<svg xmlns="http://www.w3.org/2000/svg" data-theme="dark" width="720" height="326" viewBox="0 0 720 326" role="img" aria-labelledby="t d"><title id="t">Peak memory of a first send</title><desc id="d">Heap in use at its highest during a send in a new process, generator table included. 1 → 2: 1.0 MB. 2 → 2: 1.0 MB. 4 → 4: 1.3 MB. 1 → 13: 3.2 MB.</desc><style>
svg { --surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--band:#f0efec;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { svg:not([data-theme="light"]) { --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500; } }
svg[data-theme="dark"] { --surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500; }
.bg { fill: var(--surface); }
.title { fill: var(--ink); font-size: 16px; font-weight: 600; }
.sub { fill: var(--ink2); font-size: 12px; }
.label { fill: var(--ink2); font-size: 12px; }
.value { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.note { fill: var(--muted); font-size: 11px; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .s4 { fill: var(--s4); }
.l1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ideal { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.ref { stroke: var(--ink2); stroke-width: 1; }
.dot1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.dot2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.dot3 { fill: var(--s3); stroke: var(--surface); stroke-width: 2; }
.crit { fill: #d03b3b; }
.crit-ink { fill: var(--ink); font-size: 12px; font-weight: 600; }
.link { stroke: var(--axis); stroke-width: 2; }
.mark { stroke: var(--surface); stroke-width: 1; }
.band { fill: var(--band); }
.band.alt { fill-opacity: 0.5; }
