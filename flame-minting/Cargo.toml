[package]
name = "flame-minting"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
bitcoin = "0.32"
btc-integration = { path = "../btc-integration" }
flame-chain-service = { path = "../flame-chain-service" }
flamechain = { path = "../flamechain" }
flame-storage = { path = "../flame-storage" }
flamevm = { path = "../flamevm" }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4.33"
thiserror = "2.0.19"

[dev-dependencies]
# The tests run on Bitcoin in memory, and on a regtest bitcoind.
btc-integration = { path = "../btc-integration", features = ["memory-btc"] }
bitcoind = { version = "0.44", features = ["31_0", "download"] }
ed25519-dalek = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

[[test]]
name = "consensus"
path = "tests/consensus.rs"

[[test]]
name = "bitcoin_reorg"
path = "tests/bitcoin_reorg.rs"
