# One node's local policy. Neither interval nor the fee floor is consensus:
# the minter mints an iblock every block_interval_secs, each anchored to the
# mock core chain's tip, which grows every core_block_interval_secs; the fee
# floor is this node's own opinion about what is worth relaying.
data_dir = "./data"
genesis = "./genesis.json"
rpc_bind = "127.0.0.1:8545"
block_interval_secs = 5
core_block_interval_secs = 15
minimum_fee = 0
# Where the mock core indexer keeps the core blocks it has mined. Default: <data_dir>/indexer.
# indexer_dir = "./data/indexer"
