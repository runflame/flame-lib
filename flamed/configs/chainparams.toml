# The Flame devnet definition. Every node on this network reads exactly
# these bytes; `flamed genesis` turns them into a genesis.json all of them
# agree on.
version = 1

# The HRP an `address` allocation below is read with. Optional, testnet by
# default. It reaches no consensus value: genesis.json records the resolved
# predicate either way.
network = "testnet"

[storage]
# unit_bytes, initial_pool_units, lease_duration_blocks,
# issued_units_per_block, minimum_lease_units, minimum_remaining_units,
# lease_record_bytes, initial_price_sparks_per_unit — every field is
# optional and falls back to the upstream StorageParams::default().

[limits]
# max_transactions, max_witness_bytes, max_transaction_script_bytes,
# max_script_bytes, max_transaction_gas, max_gas_credit, max_external_gas,
# max_internal_gas, max_multiplications_per_transaction,
# max_multiplications, max_messages, max_proofs_per_transaction,
# max_proof_depth, max_core_blocks, max_burns — every field is optional and falls back to the upstream
# BlockLimits::default().

# 1000 Flame, the whole supply of this devnet, under the first receiving
# address of the wallet seeded with [0xa1; 64] on testnet — the account the
# tests call A, so a fresh devnet is spendable out of the box. Exactly one
# of `address` and `predicate` names the holder; an operator writes the
# address a wallet printed and never handles a wallet-internal value.
#
# The image (flamed/Dockerfile) keeps everything here but the address, which
# it replaces with the first receiving address of the genesis mnemonic, so
# keep exactly one allocation, named by `address`.
[[genesis]]
address = "t1ujp3zt7heh0nqyxnhlzdu2cnc7dnsef8zv6mmamae7pfl6pw0d4sm0hkyqi192pxpkrvup9md82dpt8p0a5h6ujq4t4ccvwkv5aj6ej38p45csjqh9wsn6"
qty_sparks = 100000000000
