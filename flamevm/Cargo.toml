[package]
name = "flamevm"
version = "0.1.0"
authors = ["Oleg Andreev <oleganza@gmail.com>"]
edition = "2018"
license = "Apache-2.0"
description = "Flame virtual machine"

[dependencies]
cells = { path = "../cells" }
curve25519-dalek = { version = "4", features = ["serde", "legacy_compatibility", "rand_core"] }
merlin = { version = "3", features = ["dynamic-labels"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2.0.18"

[dependencies.bulletproofs]
git = "https://github.com/runflame/bulletproofs"
# The head of `develop` when it was pinned; a branch would let every fresh
# resolve pull whatever lands there next.
rev = "a2f52a0d1a502128f0064b7dace607c83ff7ff73"
features = ["yoloproofs"]

[dependencies.spacesuit]
path = "../spacesuit"

[dependencies.musig]
path = "../musig"

[features]
default = []
nightly = ["curve25519-dalek/alloc", "bulletproofs/nightly"]

[dev-dependencies]
criterion = "0.2"

[build-dependencies]
cells = { path = "../cells" }

[[bench]]
name = "gas"
harness = false
